<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW & Associates | Strategic Advisory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffffff;
            --text-dim: rgba(255,255,255,0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* The Hero Background */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Replace the URL below with your chosen high-res image */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.pexels.com/photos/3709434/pexels-photo-3709434.jpeg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        nav {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { height: 30px; filter: invert(1); }

        .media-link {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }

        .media-link:hover { border-color: #fff; color: #fff; }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }

        .brand-statement h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .brand-statement p {
            font-size: 1.1rem;
            color: var(--text-dim);
            max-width: 400px;
        }

        .application-area {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 60px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .form-group { margin-bottom: 30px; }

        label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-dim);
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 0;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus { border-color: #fff; }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            width: 100%;
        }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .brand-statement h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="hero-bg"></div>
    
    <nav>
        <img src="https://swassociates.github.io/swlogo.png" class="logo" alt="SW & Associates">
        <a href="https://www.linkedin.com/company/sw-and-associates/" class="media-link">SW & Associates</a>
    </nav>

    <main>
        <section class="brand-statement">
            <h1>Strategic Intelligence. Modern Narrative.</h1>
            <p>We solve high-stakes challenges for global leaders and emerging brands.</p>
        </section>

        <section class="application-area">
            <form action="https://formspree.io/mvowjolp" method="POST">
                <div class="form-group">
                    <label>Objective</label>
                    <input type="text" name="objective" placeholder="Why would you like to hire us?" required>
                </div>
                <div class="form-group">
                    <label>The Case</label>
                    <textarea name="case" placeholder="Why should we prioritize your objective?" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Professional Contact</label>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>
                <button type="submit">Submit for Review</button>
            </form>
        </section>
    </main>
</body>
</html>
